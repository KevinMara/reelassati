name: Platform maintenance
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: platform-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run authenticated maintenance
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const issuer = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          issuer.searchParams.set('audience', 'https://reelassati.app');
          const tokenResponse = await fetch(issuer, {headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if (!tokenResponse.ok) throw new Error('Scheduler identity unavailable');
          const {value:token}=await tokenResponse.json();
          console.log(`::add-mask::${token}`);
          const response=await fetch('https://reelassati.kevinbiz.chatgpt.site/api/internal/maintenance',{method:'POST',headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(480000)});
          const result=await response.json();
          console.log(JSON.stringify(result));
          if(!response.ok || result.ok===false) throw new Error('Maintenance needs attention');
          JS

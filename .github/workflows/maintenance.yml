name: Platform maintenance
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      grant_email:
        description: "Existing account to grant 1,000 credits (leave empty for maintenance)"
        required: false
        type: string
      grant_request_id:
        description: "Unique grant reference; reuse the SAME reference when retrying"
        required: false
        type: string
permissions:
  id-token: write
  contents: read
concurrency:
  group: platform-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run authenticated maintenance
        shell: bash
        env:
          GRANT_EMAIL: ${{ inputs.grant_email }}
          GRANT_REQUEST_ID: ${{ inputs.grant_request_id }}
        run: |
          node --input-type=module <<'JS'
          const issuer = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          issuer.searchParams.set('audience', 'https://reelassati.app');
          const tokenResponse = await fetch(issuer, {headers:{Authorization:`Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`}});
          if (!tokenResponse.ok) throw new Error('Scheduler identity unavailable');
          const {value:token}=await tokenResponse.json();
          console.log(`::add-mask::${token}`);
          const grant = process.env.GRANT_EMAIL?.trim();
          if(grant && !process.env.GRANT_REQUEST_ID) throw new Error('A stable grant request ID is required');
          const response=await fetch('https://reelassati.kevinbiz.chatgpt.site/api/internal/maintenance',{method:'POST',headers:{Authorization:`Bearer ${token}`,...(grant ? {'Content-Type':'application/json'} : {})},...(grant ? {body:JSON.stringify({action:'grant-1000-credits',email:grant,requestId:process.env.GRANT_REQUEST_ID})} : {}),signal:AbortSignal.timeout(480000)});
          const result=await response.json();
          console.log(JSON.stringify(result));
          if(!response.ok || result.ok===false) throw new Error('Maintenance needs attention');
          JS

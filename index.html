<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REELassati — Short-Form Content, Accelerated. Sharpened.</title>
    <meta
      name="description"
      content="The editing-first studio for short-form content. Script, cut, caption and publish in one workspace."
    />
    <link
      rel="icon"
      type="image/png"
      href="/brand/reelassati-mark-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/brand/reelassati-mark-transparent.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet" />
    <script>
      // SPA redirect handler
      (function() {
        var savedTheme = localStorage.getItem('theme');
        var initialTheme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.classList.add(initialTheme);
        document.documentElement.style.colorScheme = initialTheme;
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          window.history.replaceState(null, null, redirect);
        }
        if (/^#\/dashboard(?:\/|$)/.test(window.location.hash)) {
          document.documentElement.classList.add('entry-route-pending');
        }
      })();
    </script>
    <style>
      #entry-boot-screen { display: none; }
      .entry-route-pending #entry-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: block;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        .entry-route-pending #entry-boot-screen { background: #0a0a0f; }
      }
      .entry-route-pending.light #entry-boot-screen { background: #fafafa; }
      .entry-route-pending.dark #entry-boot-screen { background: #0a0a0f; }
    </style>
  </head>
  <body>
    <div id="entry-boot-screen" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
